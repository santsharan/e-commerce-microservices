apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: commerce-flow
resources:
  - namespace.yaml
  - configmap.yaml
  - mongo.yaml
  - redis.yaml
  - kafka.yaml
  - apps.yaml
  - hpa.yaml
  - network-policies.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: mongo-init
    files:
      - mongo-start.sh
      - mongo-init.js
  - name: kafka-topics
    files:
      - create-topics.sh
  - name: grafana-datasources
    files:
      - grafana/datasources.yml
  - name: grafana-dashboard-provider
    files:
      - grafana/dashboards.yml
  - name: grafana-kafka-dashboard
    files:
      - grafana/kafka-flow.json
