name: commerce-flow

# Host processes use 127.0.0.1 for MongoDB because the replica set advertises that
# address. Containers use the Docker DNS name and directConnection so they do not
# follow the advertisement back to their own loopback.
x-app-environment: &app-environment
  NODE_ENV: development
  LOG_LEVEL: info
  MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: kafka:19092
  JWT_ISSUER: commerce-identity
  JWT_AUDIENCE: commerce-api
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

# Block scalar: a quoted YAML string would end at the first " inside the JavaScript.
x-app-healthcheck: &app-healthcheck
  test:
    - CMD-SHELL
    - >-
      node -e "fetch('http://127.0.0.1:' + process.env.PORT + '/health/readiness').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 25s

x-app-depends: &app-depends
  mongo-init:
    condition: service_completed_successfully
  redis:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully

x-gateway-depends: &gateway-depends
  mongo-init:
    condition: service_completed_successfully
  redis:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully
  identity-service:
    condition: service_healthy
  catalog-service:
    condition: service_healthy
  inventory-service:
    condition: service_healthy
  order-service:
    condition: service_healthy

x-jwt-public: &jwt-public
  # Created by `make jwt-keys`. Compose mounts the files; they are not baked into the image.
  - ./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro

x-jwt-pair: &jwt-pair
  - ./secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
  - ./secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro

services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./infra/docker/mongo/init-replica-set.js:/init-replica-set.js:ro
    entrypoint: ["mongosh", "--host", "mongo:27017", "--quiet", "--file", "/init-replica-set.js"]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--bind", "0.0.0.0", "--protected-mode", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-broker-api-versions.sh",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 25s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      TOPIC_PARTITIONS: 3
    volumes:
      - ./infra/docker/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otel-collector.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    volumes:
      - ./infra/docker/otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on:
      - jaeger
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/docker/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.5.0
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./infra/docker/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3007:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

  api-gateway:
    profiles: ["apps", "full"]
    image: commerce-flow/api-gateway:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      <<: *app-environment
      SERVICE_NAME: api-gateway
      PORT: "3000"
      MONGO_DATABASE: unused
      KAFKA_CLIENT_ID: api-gateway
      KAFKA_GROUP_ID: api-gateway
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
      GATEWAY_IDENTITY_URL: http://identity-service:3001
      GATEWAY_CATALOG_URL: http://catalog-service:3002
      GATEWAY_INVENTORY_URL: http://inventory-service:3003
      GATEWAY_ORDER_URL: http://order-service:3004
    ports:
      - "3000:3000"
    volumes: *jwt-public
    depends_on: *gateway-depends
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck: *app-healthcheck

  identity-service:
    profiles: ["apps", "full"]
    image: commerce-flow/identity-service:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: identity-service
    environment:
      <<: *app-environment
      SERVICE_NAME: identity-service
      PORT: "3001"
      MONGO_DATABASE: identity-db
      KAFKA_CLIENT_ID: identity-service
      KAFKA_GROUP_ID: identity-service
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
    ports:
      - "3001:3001"
    volumes: *jwt-pair
    depends_on: *app-depends
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck: *app-healthcheck

  catalog-service:
    profiles: ["apps", "full"]
    image: commerce-flow/catalog-service:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: catalog-service
    environment:
      <<: *app-environment
      SERVICE_NAME: catalog-service
      PORT: "3002"
      MONGO_DATABASE: catalog-db
      KAFKA_CLIENT_ID: catalog-service
      KAFKA_GROUP_ID: catalog-service
    ports:
      - "3002:3002"
    depends_on: *app-depends
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck: *app-healthcheck

  inventory-service:
    profiles: ["apps", "full"]
    image: commerce-flow/inventory-service:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: inventory-service
    environment:
      <<: *app-environment
      SERVICE_NAME: inventory-service
      PORT: "3003"
      MONGO_DATABASE: inventory-db
      KAFKA_CLIENT_ID: inventory-service
      KAFKA_GROUP_ID: inventory-service
    ports:
      - "3003:3003"
    depends_on: *app-depends
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck: *app-healthcheck

  order-service:
    profiles: ["apps", "full"]
    image: commerce-flow/order-service:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: order-service
    environment:
      <<: *app-environment
      SERVICE_NAME: order-service
      PORT: "3004"
      MONGO_DATABASE: order-db
      KAFKA_CLIENT_ID: order-service
      KAFKA_GROUP_ID: order-service
    ports:
      - "3004:3004"
    depends_on: *app-depends
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck: *app-healthcheck

  payment-service:
    profiles: ["apps", "full"]
    image: commerce-flow/payment-service:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: payment-service
    environment:
      <<: *app-environment
      SERVICE_NAME: payment-service
      PORT: "3005"
      MONGO_DATABASE: payment-db
      KAFKA_CLIENT_ID: payment-service
      KAFKA_GROUP_ID: payment-service
    ports:
      - "3005:3005"
    depends_on: *app-depends
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck: *app-healthcheck

  notification-service:
    profiles: ["apps", "full"]
    image: commerce-flow/notification-service:local
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        SERVICE: notification-service
    environment:
      <<: *app-environment
      SERVICE_NAME: notification-service
      PORT: "3006"
      MONGO_DATABASE: notification-db
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-service
    ports:
      - "3006:3006"
    depends_on: *app-depends
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck: *app-healthcheck

volumes:
  mongo-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  loki-data:
