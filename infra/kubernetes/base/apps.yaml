apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: commerce-flow
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: commerce-flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: commerce-flow
        app.kubernetes.io/component: edge
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api-gateway
          image: commerce-flow/api-gateway:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: commerce-flow-config
          env:
            - name: SERVICE_NAME
              value: api-gateway
            - name: PORT
              value: "3000"
            - name: MONGO_DATABASE
              value: unused
            - name: KAFKA_CLIENT_ID
              value: api-gateway
            - name: KAFKA_GROUP_ID
              value: api-gateway
            - name: JWT_PUBLIC_KEY_PATH
              value: /var/commerce-flow/jwt/jwt-public.pem
            - name: GATEWAY_IDENTITY_URL
              value: http://identity-service:3001
            - name: GATEWAY_CATALOG_URL
              value: http://catalog-service:3002
            - name: GATEWAY_INVENTORY_URL
              value: http://inventory-service:3003
            - name: GATEWAY_ORDER_URL
              value: http://order-service:3004
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: jwt
              mountPath: /var/commerce-flow/jwt
              readOnly: true
      volumes:
        - name: jwt
          secret:
            secretName: commerce-flow-jwt
            items:
              - key: jwt-public.pem
                path: jwt-public.pem
---
