apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: commerce-flow
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: commerce-flow
    app.kubernetes.io/component: data
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
        app.kubernetes.io/part-of: commerce-flow
        app.kubernetes.io/component: data
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsUser: 0
      containers:
        - name: mongo
          image: mongo:8.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/mongo-start.sh"]
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --host
                - 127.0.0.1
                - --eval
                - "if (!db.hello().isWritablePrimary) quit(1)"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: data
          emptyDir: {}
        - name: scripts
          configMap:
            name: mongo-init
            defaultMode: 0555
